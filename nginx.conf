server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Necesario para React Router: cualquier ruta que Nginx no encuentre
    # como archivo real, la resuelve devolviendo index.html, para que
    # React Router decida qué mostrar en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}